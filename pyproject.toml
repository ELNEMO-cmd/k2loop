[project]
name = "k2loop"
version = "0.2.0"
description = "Local continuous agent: K2 Horizon 7B + Laya + Qwen, Tree-of-Thoughts / Self-Consistency, research-first"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
trace = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
k2loop = "k2loop.cli:main"
generic-cli = "k2loop.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
